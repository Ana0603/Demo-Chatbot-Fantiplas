<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Fantiplas</title>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f0f2f5;
  font-family:'Segoe UI', sans-serif;
}

*{
  box-sizing:border-box;
}

/* BOTÓN */
#chat-toggle{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#89AF29;
  color:#fff;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  z-index:999;
}

/* BURBUJA */
#chat-bubble{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  padding:10px 15px;
  border-radius:20px;
  font-size:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  z-index:997;
  opacity:0;
  transition:all .3s ease;
}

#chat-bubble.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#chat-bubble.hide{
  opacity:0;
  transform:translateX(-50%) translateY(10px);
}

/* CHAT */
#chat-wrapper{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  background:#fff;
  display:flex;
  flex-direction:column;
  z-index:998;
  opacity:0;
  transition:all .3s ease;
}

#chat-wrapper.active{
  opacity:1;
}

#chat-wrapper.hidden{
  display:none;
}

/* HEADER */
#chat-header{
  background:#89AF29;
  color:#fff;
  padding:14px 18px;
  font-weight:bold;
}

.header-chat{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:50%;
}

/* BODY CHAT */
#chat{
  flex:1;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

/* MENSAJES */
.message{
  max-width:75%;
  padding:10px 14px;
  margin:6px 0;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
}

.bot{
  background:#e4e6eb;
  align-self:flex-start;
}

.user{
  background:#89AF29;
  color:#fff;
  align-self:flex-end;
}

/* OPCIONES */
.options{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:6px 0;
}

.option-btn{
  background:#f1f1f1;
  border:none;
  padding:8px 12px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s ease;
  font-size:14px;
}

.option-btn.selected{
  background:#89AF29;
  color:#fff;
}

.option-btn.disabled{
  opacity:.5;
  pointer-events:none;
}

/* INPUT */
#input-area{
  display:flex;
  align-items:center;
  gap:10px;
  border-top:1px solid #ddd;
  padding:12px;
  background:#fff;
}

#userInput{
  flex:1;
  border:none;
  padding:12px 14px;
  border-radius:22px;
  background:#f1f1f1;
  font-size:15px;
  outline:none;
}

button.send{
  background:#89AF29;
  border:none;
  color:#fff;
  padding:12px 18px;
  border-radius:22px;
  cursor:pointer;
  font-size:14px;
}

/* TYPING */
.typing{
  letter-spacing:3px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:.3;}
  50%{opacity:1;}
  100%{opacity:.3;}
}

/* MOBILE */
@media (max-width:768px){

  #chat-toggle{
    width:85px;
    height:85px;
    font-size:34px;
    bottom:25px;
  }

  #chat-bubble{
    width:85%;
    padding:18px;
    font-size:18px;
    border-radius:24px;
    bottom:125px;
    text-align:center;
  }

  #chat-wrapper{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:calc(100dvh - 120px);
    max-width:none;
    border-radius:25px 25px 0 0;
    margin:0;
    padding-bottom:10px;
  }

  #chat-header{
    padding:20px;
    font-size:22px;
  }

  .header-chat{
    gap:15px;
  }

  .logo{
    width:55px;
    height:55px;
  }

  #chat{
    padding:20px;
    gap:8px;
  }

  .message{
    max-width:90%;
    padding:16px 20px;
    font-size:18px;
    line-height:1.5;
    border-radius:24px;
  }

  .options{
    gap:10px;
  }

  .option-btn{
    padding:14px 18px;
    font-size:17px;
    border-radius:20px;
  }

  #input-area{
    padding:18px;
  }

  #userInput{
    padding:16px 18px;
    font-size:18px;
    border-radius:25px;
  }

  button.send{
    padding:16px 22px;
    font-size:17px;
    border-radius:25px;
  }

}
</style>
</head>

<body>

<!-- BOTÓN -->
<div id="chat-toggle">🤖</div>
<div id="chat-bubble">👋 Hola, soy el asistente de Fantiplas</div>

<!-- CHAT -->
<div id="chat-wrapper" class="hidden">
  <div id="chat-header">
    <div class="header-chat">
      <img src="logo-fantiplas.jpg" class="logo">
      <span>FantiBot</span>
    </div>
  </div>

  <div id="chat"></div>

  <div id="input-area">
    <input id="userInput" placeholder="Escribe...">
    <button class="send" onclick="sendMessage()">Enviar</button>
  </div>
</div>

  <script src="respuestas.js"></script>

<script>
let step = 0;
let data = {};

  const palabrasCotizacion = [
  "cotizar",
  "comprar",
  "pedido",
  "proveedor",
  "fabricar",
  "produccion",
  "producción",
  "necesito",
  "quiero",
  "volumen",
  "cantidad",
  "unidades"
];

const chat = document.getElementById("chat");

/* MENSAJES */
function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.className = "message " + type;
  msg.innerText = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

/* OPCIONES */
function addOptions(options) {
  const container = document.createElement("div");
  container.className = "options";

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt;

    btn.onclick = () => {
      btn.classList.add("selected");
      container.querySelectorAll(".option-btn").forEach(b => b.classList.add("disabled"));
      handleResponse(opt);
    };

    container.appendChild(btn);
  });

  chat.appendChild(container);
}

/* TYPING */
function typingIndicator() {
  const typing = document.createElement("div");
  typing.className = "message bot typing";
  typing.innerHTML = "•••";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
  return typing;
}

/* BOT */
function bot(text, options = []) {
  const typing = typingIndicator();
  const delay = Math.random() * 1000 + 800;

  setTimeout(() => {
    typing.remove();
    addMessage(text, "bot");
    if (options.length) addOptions(options);
  }, delay);
}

/* ENVIAR */
function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";
  handleResponse(text);
}

/* ENTER */
document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

/* FLUJO */
function handleResponse(msg) {

switch(step) {

case 0:

  const opcionesInicio = [
    "cotizar envases",
    "consultas de productos",
    "contactar con un asesor"
  ];

  if (!opcionesInicio.includes(msg.toLowerCase())) {
    bot(
      "Para poder ayudarte mejor 😊 por favor selecciona una opción:",
      [
        "Cotizar envases",
        "Consultas de productos",
        "Contactar con un asesor"
      ]
    );
    break;
  }

  if (msg === "Cotizar envases") {
    step = 1;

    bot(
      "¿Compras para empresa o uso personal?",
      [
        "Empresa",
        "Uso personal"
      ]
    );
  }

  else if (msg === "Consultas de productos") {
    step = 300;

    bot(
      "Cuéntame qué producto buscas o qué duda tienes"
    );
  }

  else if (msg === "Contactar con un asesor") {
    step = 200;

    bot(
      "Muy pronto podrás contactar directamente con un asesor 😊"
    );
  }

  break;


case 1: {

  const opcionesTipoCliente = [
    "Empresa",
    "Uso personal"
  ];

  if (!opcionesTipoCliente.includes(msg.trim())) {
    step = 750;
    data.volverStep = 1;

    bot(
      "Parece que tienes una consulta 😊 ¿qué prefieres hacer?",
      [
        "Seguir cotización",
        "Consultar productos"
      ]
    );

    break;
  }

  data.tipoCliente = msg.trim();

  if (data.tipoCliente === "Uso personal") {

    bot("Gracias por escribirnos 😊");

    setTimeout(() => {
      bot(
        "Actualmente trabajamos únicamente con ventas empresariales y pedidos por volumen, por lo que no manejamos ventas por unidad."
      );
    }, 1200);

    setTimeout(() => {
      bot(
        "Si representas una empresa o seleccionaste la opción incorrecta, puedes continuar aquí:",
        [
          "Soy empresa",
          "Hablar con asesor"
        ]
      );
    }, 2400);

    step = 100;
    break;
  }

  step = 2;

  bot(
    "¿Qué tipo de producto necesitas?",
    [
      "Envases alimentos",
      "Cuidado personal",
      "Hogar"
    ]
  );

  break;
}


case 100: {

  const opcionesUsoPersonal = [
    "Soy empresa",
    "Hablar con asesor"
  ];

  if (!opcionesUsoPersonal.includes(msg)) {
    bot(
      "Por favor selecciona una opción 😊",
      [
        "Soy empresa",
        "Hablar con asesor"
      ]
    );
    break;
  }

  if (msg === "Soy empresa") {
    step = 2;

    bot(
      "Perfecto 🙌 ¿Qué tipo de producto necesitas?",
      [
        "Envases alimentos",
        "Cuidado personal",
        "Hogar"
      ]
    );
  }

  else if (msg === "Hablar con asesor") {
    step = 999;

    bot(
      "Claro 😊 Un asesor se pondrá en contacto contigo pronto."
    );
  }

  break;
}


case 2:

    data.volverStep = 2;

  const opcionesValidas = [
    "envases alimentos",
    "cuidado personal",
    "hogar"
  ];

  if (!opcionesValidas.includes(msg.toLowerCase())) {
    step = 750;

    bot(
      "Parece que tienes una consulta ¿qué prefieres hacer?",
      [
        "Seguir cotización",
        "Consultar productos"
      ]
    );

    break;
  }

  data.tipoProducto = msg;
  step = 3;

  bot(
    "Para tener una idea 😊 ¿Qué cantidad estás pensando manejar?",
    [
      "Menos de 1.000 unidades",
      "1.000 a 10.000",
      "Más de 10.000"
    ]
  );

  break;

case 750:

  if (msg === "Seguir cotización") {

    bot("De acuerdo 😊");

    setTimeout(() => {
      bot("Volvamos a la cotización 🙌");
      step = data.volverStep;
    }, 1000);
  }

  else if (msg === "Consultar productos") {
    step = 760;

    bot(
      "Entendido ⚠️ Ten en cuenta que al salir de la cotización será necesario comenzarla nuevamente después.",
      [
        "Aceptar",
        "Volver a la cotización"
      ]
    );
  }

  else {
    bot(
      "Por favor selecciona una opción",
      [
        "Seguir cotización",
        "Consultar productos"
      ]
    );
  }

  break;

    case 760:

  if (msg === "Aceptar") {
    step = 300;

    bot(
      "Perfecto 😊 ahora cuéntame qué producto buscas o qué duda tienes."
    );
  }

  else if (msg === "Volver a la cotización") {

    bot("De acuerdo 😊");

    setTimeout(() => {
      bot("Volvamos a la cotización 🙌");
      step = data.volverStep;
    }, 1000);
  }

  else {
    bot(
      "Por favor selecciona una opción",
      [
        "Aceptar",
        "Volver a la cotización"
      ]
    );
  }

  break;

case 3:
  data.cantidad = msg;
  step = 4;
  bot("¿Qué producto específico necesitas?");
  break;


case 4:
  data.producto = msg;
  step = 5;
  bot("¿Qué capacidad estás buscando? (aproximada)");
  break;


case 5:
  data.capacidad = msg;
  step = 6;
  bot("¿Hay algún material que prefieras o necesitas recomendación?");
  break;


case 6:
  data.material = msg;
  step = 7;
  bot(
    "¿Ya cuentas con un molde o necesitas desarrollarlo?",
    ["Ya tengo", "Necesito crear uno"]
  );
  break;


case 7:
  data.molde = msg;
  step = 8;
  bot(
    "Entendido 👍 ¿Lo necesitas transparente o en algún color específico?",
    ["Transparente", "Color"]
  );
  break;


case 8:
  data.color = msg;
  step = 9;
  bot(
    "¿En qué plazo te gustaría recibirlo?",
    ["Urgente", "1 a 3 meses", "Solo estoy cotizando"]
  );
  break;


case 9:
  data.tiempo = msg;
  step = 10;
  bot(
    "Última pregunta 👀 ¿Has cotizado con otros proveedores?",
    ["Sí", "No"]
  );
  break;


case 10:
  data.comparando = msg;
  step = 11;
  bot("Perfecto 🙌 Para finalizar, ¿me compartes tu nombre?");
  break;


case 11:
  data.nombre = msg;
  step = 12;
  bot("¿Para qué empresa trabajas?");
  break;


case 12:
  data.empresa = msg;
  step = 13;
  bot("Para que un asesor te contacte directamente, ¿me compartes tu correo?");
  break;


case 13:
  if (!msg.includes("@")) {
    bot("⚠️ Solo para confirmar, ¿me puedes enviar un correo válido?");
    return;
  }

  data.email = msg;
  step = 14;
  bot("Si prefieres contacto por WhatsApp, también puedes dejarme tu número 📱");
  break;


case 14:
data.telefono = msg;
step = 500;

fetch("https://hook.us2.make.com/hvl1sunf2xk4tq4mbkiwwvnndgk0s77q", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    nombre: data.nombre,
    empresa: data.empresa,
    email: data.email,
    telefono: data.telefono,
    tipoCliente: data.tipoCliente,
    tipoProducto: data.tipoProducto,
    cantidad: data.cantidad,
    producto: data.producto,
    capacidad: data.capacidad,
    material: data.material,
    molde: data.molde,
    color: data.color,
    tiempo: data.tiempo,
    comparando: data.comparando
  })
})
.then(response => response.text())
.then(result => {
  console.log("Enviado:", result);
})
.catch(error => {
  console.error("Error:", error);
});

bot("¡Listo! 🚀 Ya recibimos tu solicitud. Un asesor se pondrá en contacto contigo muy pronto.");


case 300: {

  const texto = msg.toLowerCase();
  let respondido = false;

  const quiereCotizar = palabrasCotizacion.some(p =>
    texto.includes(p)
  );

  if (quiereCotizar) {
    step = 650;

    bot(
      "Parece que buscas una cotización 😊 ¿qué prefieres hacer?",
      [
        "Cotizar envases",
        "Seguir consultando"
      ]
    );

    break;
  }

  const preguntasPrecio = [
    "precio",
    "valor",
    "costo",
    "cuanto vale",
    "cuánto vale",
    "cuanto cuesta",
    "cuánto cuesta"
  ];

  const preguntaPrecio = preguntasPrecio.some(p =>
    texto.includes(p)
  );

  if (preguntaPrecio) {
    step = 600;

    bot(
      "Para calcular el precio de un producto necesitamos analizar factores como molde, material, color, decorado y volumen de producción.\n\nPor eso te recomendamos realizar una cotización para que un asesor revise tu necesidad y pueda darte un precio más preciso 😊",
      [
        "Cotizar productos",
        "Hablar con asesor"
      ]
    );

    break;
  }

  for (let clave in respuestasRapidas) {
    if (texto.includes(clave)) {
      bot(respuestasRapidas[clave]);
      respondido = true;
      break;
    }
  }

  if (!respondido) {
    bot(
      "No encontré esa información exacta todavía, pero un asesor puede ayudarte mejor 😊"
    );
  }

  break;
}


case 650:

  if (msg === "Envases industriales") {
    step = 1;

    bot(
      "Perfecto 🙌 vamos a ayudarte con tu cotización.\n\n¿Compras para empresa o uso personal?",
      ["Empresa", "Uso personal"]
    );
  }

  break;


case 500:

  if (msg === "Consultar productos") {
    step = 300;
    bot("Perfecto 😊 cuéntame qué producto buscas o qué duda tienes.");
  }

  else if (msg === "Hablar con asesor") {
    step = 999;
    bot("Claro 🙌 Un asesor comercial se pondrá en contacto contigo pronto.");
  }

  else {
    bot(
      "Por favor selecciona una opción 😊",
      [
        "Consultar productos",
        "Hablar con asesor"
      ]
    );
  }

  break;


case 600:

  if (msg === "Envases industriales") {
    step = 1;

    bot(
      "¿Que tipo de producto necesitas",
      ["Alimentos", "Cosméticos", "Farmaceúticos", "Hogar - Aseo"]
    );
  }

  else if (msg === "Hablar con asesor") {
    step = 999;
    bot("Claro Un asesor comercial se pondrá en contacto contigo pronto, mientrastanto y para agilizar el proceso contienuemos con las preguntas.");
  }

  else {
    bot(
      "Para salir de la cotización, por favor selecciona una opción",
      [
        "Cotizar productos",
        "Hablar con asesor"
      ]
    );
  }

  break;
  }
  
}

/* TOGGLE */
const toggleBtn = document.getElementById("chat-toggle");
const chatWrapper = document.getElementById("chat-wrapper");
const bubble = document.getElementById("chat-bubble");

toggleBtn.onclick = () => {

  if (chatWrapper.classList.contains("active")) {
    chatWrapper.classList.remove("active");
    chatWrapper.classList.add("hidden");
    toggleBtn.innerText = "🤖";

    bubble.classList.remove("hide");
    bubble.classList.add("show");

  } else {
    chatWrapper.classList.remove("hidden");
    chatWrapper.classList.add("active");
    toggleBtn.innerText = "✖";

    bubble.classList.remove("show");
    bubble.classList.add("hide");
  }
};

/* BURBUJA AUTO */
setTimeout(() => bubble.classList.add("show"), 1000);
setTimeout(() => bubble.classList.remove("show"), 6000);

/* INICIO */
setTimeout(() => {
  bot("Hola, soy FantiBot, el asistente de Fantiplas.");

  bot("Le presento nuestras tres líneas de negocio, por favor seleccione la que mas se ajusta a su necesidad", [
      "Envases industriales",
      "Productos de Merchandisign | Promocional",
      "Retal, supermerccados y miselaneas"
]);

}, 500);

</script>
</body>
</html>
