<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Fantiplas</title>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f0f2f5;
  font-family:'Segoe UI', sans-serif;
}

*{
  box-sizing:border-box;
}

/* BOTÓN */
#chat-toggle{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#89AF29;
  color:#fff;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  z-index:999;
}

/* BURBUJA */
#chat-bubble{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  padding:10px 15px;
  border-radius:20px;
  font-size:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  z-index:997;
  opacity:0;
  transition:all .3s ease;
}

#chat-bubble.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#chat-bubble.hide{
  opacity:0;
  transform:translateX(-50%) translateY(10px);
}

/* CHAT */
#chat-wrapper{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  background:#fff;
  display:flex;
  flex-direction:column;
  z-index:998;
  opacity:0;
  transition:all .3s ease;
}

#chat-wrapper.active{
  opacity:1;
}

#chat-wrapper.hidden{
  display:none;
}

/* HEADER */
#chat-header{
  background:#89AF29;
  color:#fff;
  padding:14px 18px;
  font-weight:bold;
}

.header-chat{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:50%;
}

/* BODY CHAT */
#chat{
  flex:1;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

/* MENSAJES */
.message{
  max-width:75%;
  padding:10px 14px;
  margin:6px 0;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
}

.bot{
  background:#e4e6eb;
  align-self:flex-start;
}

.user{
  background:#89AF29;
  color:#fff;
  align-self:flex-end;
}

/* OPCIONES */
.options{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:6px 0;
}

.option-btn{
  background:#f1f1f1;
  border:none;
  padding:8px 12px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s ease;
  font-size:14px;
}

.option-btn.selected{
  background:#89AF29;
  color:#fff;
}

.option-btn.disabled{
  opacity:.5;
  pointer-events:none;
}

/* INPUT */
#input-area{
  display:flex;
  align-items:center;
  gap:10px;
  border-top:1px solid #ddd;
  padding:12px;
  background:#fff;
}

#userInput{
  flex:1;
  border:none;
  padding:12px 14px;
  border-radius:22px;
  background:#f1f1f1;
  font-size:15px;
  outline:none;
}

button.send{
  background:#89AF29;
  border:none;
  color:#fff;
  padding:12px 18px;
  border-radius:22px;
  cursor:pointer;
  font-size:14px;
}

/* TYPING */
.typing{
  letter-spacing:3px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:.3;}
  50%{opacity:1;}
  100%{opacity:.3;}
}

/* MOBILE */
@media (max-width:768px){

  #chat-toggle{
    width:85px;
    height:85px;
    font-size:34px;
    bottom:25px;
  }

  #chat-bubble{
    width:85%;
    padding:18px;
    font-size:18px;
    border-radius:24px;
    bottom:125px;
    text-align:center;
  }

  #chat-wrapper{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:calc(100dvh - 120px);
    max-width:none;
    border-radius:25px 25px 0 0;
    margin:0;
    padding-bottom:10px;
  }

  #chat-header{
    padding:20px;
    font-size:22px;
  }

  .header-chat{
    gap:15px;
  }

  .logo{
    width:55px;
    height:55px;
  }

  #chat{
    padding:20px;
    gap:8px;
  }

  .message{
    max-width:90%;
    padding:16px 20px;
    font-size:18px;
    line-height:1.5;
    border-radius:24px;
  }

  .options{
    gap:10px;
  }

  .option-btn{
    padding:14px 18px;
    font-size:17px;
    border-radius:20px;
  }

  #input-area{
    padding:18px;
  }

  #userInput{
    padding:16px 18px;
    font-size:18px;
    border-radius:25px;
  }

  button.send{
    padding:16px 22px;
    font-size:17px;
    border-radius:25px;
  }

}
</style>
</head>

        const chat = document.getElementById("chat");

        /* MENSAJES */
        function addMessage(text, type) {
        const msg = document.createElement("div");
        msg.className = "message " + type;
        msg.innerText = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        }

        /* OPCIONES */
        function addOptions(options) {
        const container = document.createElement("div");
        container.className = "options";

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;

            btn.onclick = () => {
            btn.classList.add("selected");
            container.querySelectorAll(".option-btn").forEach(b => b.classList.add("disabled"));
            handleResponse(opt);
            };

            container.appendChild(btn);
        });

        chat.appendChild(container);
        }

        /* TYPING */
        function typingIndicator() {
        const typing = document.createElement("div");
        typing.className = "message bot typing";
        typing.innerHTML = "•••";
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        return typing;
        }

        /* BOT */
        function bot(text, options = []) {
        const typing = typingIndicator();
        const delay = Math.random() * 1000 + 800;

        setTimeout(() => {
            typing.remove();
            addMessage(text, "bot");
            if (options.length) addOptions(options);
        }, delay);
        }

        /* ENVIAR */
        function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if(!text) return;

        addMessage(text, "user");
        input.value = "";
        handleResponse(text);
        }

        /* ENTER */
        document.getElementById("userInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
        });

        /* TOGGLE */
        const toggleBtn = document.getElementById("chat-toggle");
        const chatWrapper = document.getElementById("chat-wrapper");
        const bubble = document.getElementById("chat-bubble");

        toggleBtn.onclick = () => {

        if (chatWrapper.classList.contains("active")) {
            chatWrapper.classList.remove("active");
            chatWrapper.classList.add("hidden");
            toggleBtn.innerText = "🤖";

            bubble.classList.remove("hide");
            bubble.classList.add("show");

        } else {
            chatWrapper.classList.remove("hidden");
            chatWrapper.classList.add("active");
            toggleBtn.innerText = "✖";

            bubble.classList.remove("show");
            bubble.classList.add("hide");
        }
        };

        /* BURBUJA AUTO */
        setTimeout(() => bubble.classList.add("show"), 1000);
        setTimeout(() => bubble.classList.remove("show"), 6000);

       /* INICIO */
        setTimeout(() => {

        bot("Hola, soy FantiBot, el asistente de Fantiplas.");

        setTimeout(() => {

            "Envases industriales",
            "Productos de Merchandisign | Promocional",
            "Retal, supermercados y miselaneas"
            ]);

        }, 2500);
